<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>

<body>

    <div class="container mt-5 d-flex justify-content-center">

        <div class="card" style="width: 18rem;">

            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300" class="card-img-top" alt="Profile Image">

            <div class="card-body">

                <h5 class="card-title">Himesh</h5>

                <p class="card-text">
                    Web Developer passionate about creating responsive and user-friendly websites.
                </p>

                <a href="#" class="btn btn-primary">
                    View Profile
                </a>

            </div>

        </div>

    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-IbbVb4ZLfz1KPGyH1P6k9a2d7d4j0pF5s0v9lXf0v7u6eJfD0q9rF6gGwQp1YJ2" crossorigin="anonymous"></script>

</body>

</html>
