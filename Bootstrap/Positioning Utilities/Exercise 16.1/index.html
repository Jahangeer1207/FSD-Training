<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Footer Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <h1>Bootstrap Fixed Footer</h1>

        <p>
            This page demonstrates a footer that remains fixed
            at the bottom of the browser window.
        </p>

        <p>
            Scroll the page and notice that the footer stays
            visible at the bottom.
        </p>

    </div>

    <!-- Fixed Footer -->
    <footer class="position-fixed bottom-0 start-0 w-100 bg-dark text-white text-center py-3">

        © 2026 Student Management Portal | All Rights Reserved

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
