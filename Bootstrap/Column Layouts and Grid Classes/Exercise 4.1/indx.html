<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

 
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-4">
        <div class="row">

   
            <div class="col-md-3 bg-light p-3 border">
                <h3>Sidebar</h3>
                <ul class="list-group">
                    <li class="list-group-item">Home</li>
                    <li class="list-group-item">About</li>
                    <li class="list-group-item">Services</li>
                    <li class="list-group-item">Contact</li>
                </ul>
            </div>

         
            <div class="col-md-9 p-3 border">
                <h2>Main Content Area</h2>
                <p>
                    This is the main content section. On medium and larger
                    screens, it occupies 9 columns while the sidebar occupies
                    3 columns. On smaller screens, both sections stack vertically.
                </p>
            </div>

        </div>
    </div>


    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
