
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | CVR College</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="../index.html">CVR College</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="../index.html">Home</a>
            <a class="nav-link" href="courses.html">Courses</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Student Registration Form</h3>
        </div>

        <div class="card-body">

            <!-- Success Alert -->
            <div id="successAlert" class="alert alert-success d-none">
                🎉 Registration submitted successfully!
            </div>

            <form id="registrationForm">

                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" id="studentName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" id="mobile" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender</label>

                    <input type="radio" name="gender" value="Male" required> Male
                    <input type="radio" name="gender" value="Female" class="ms-3"> Female
                    <input type="radio" name="gender" value="Other" class="ms-3"> Other
                </div>

                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <select id="course" class="form-select" required>
                        <option value="">Select Course</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Qualification</label>
                    <input type="text" id="qualification" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea id="address" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Resume</label>
                    <input type="file" id="resume" class="form-control">
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit" class="btn btn-success">
                    Register
                </button>

            </form>

        </div>
    </div>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    Registration Successful
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                Thank you for registering! Your details have been saved successfully.
            </div>

            <div class="modal-footer">
                <button class="btn btn-success"
                        data-bs-dismiss="modal">
                    OK
                </button>
            </div>

        </div>

    </div>
</div>


<script src="../js/register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
