<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Styles VS Internal Styles</title>
    <style>
        h1 {
            color: blue;
            font-size: 20px;
        }
        p {
            color: green;
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 style="color:red; font-size: 24px;">This is a heading styled with inline styles</h1>
    <h1>This is a heading styled with internal styles </h1>
    <p>This is a paragraph styled with internal styles.</p>
    <p>1.inline styles</p>
    <p>2.internal styles</p>
    <p>3.external styles</p>
</body>
</html>
