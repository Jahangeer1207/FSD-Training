<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        Student Management Dashboard
    </header>

    <!-- Layout Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Dashboard</li>
                <li>Students</li>
                <li>Attendance</li>
                <li>Grades</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <h2>Welcome Admin</h2>
            <p>This is the main content area of the student dashboard.</p>

            <div class="cards">
                <div class="card">Total Students: 120</div>
                <div class="card">Present Today: 110</div>
                <div class="card">Absent Today: 10</div>
            </div>
        </main>

    </div>

</body>
</html>
