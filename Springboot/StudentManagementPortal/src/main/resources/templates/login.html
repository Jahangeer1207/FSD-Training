<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h3>Login</h3>
</div>

<div class="card-body">

<form method="post" action="/login">

<div class="mb-3">
<label>Email</label>
<input type="text"
       name="username"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password"
       name="password"
       class="form-control"
       required>
</div>

<button class="btn btn-primary w-100">
Login
</button>

</form>

<div class="text-center mt-3">
<a href="/register">Create Account</a>
</div>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
