<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

.sidebar{

height:100vh;

background:#212529;

}

.sidebar a{

color:white;

display:block;

padding:15px;

text-decoration:none;

}


.sidebar a:hover{

background:#0d6efd;

}

</style>


</head>


<body>


<div class="container-fluid">


<div class="row">


<!-- Sidebar -->

<div class="col-md-3 sidebar">


<h3 class="text-white p-3">

Student Portal

</h3>


<a href="/dashboard">
Dashboard
</a>


<a href="/students">
View Students
</a>


<a href="/students/add">
Add Student
</a>


<a href="/profile">
Profile
</a>


<a href="/contact">
Contact
</a>


<a href="/logout">
Logout
</a>


</div>



<!-- Main Content -->

<div class="col-md-9 p-5">


<h2>
Welcome 
<span th:text="${user.name}">
</span>
</h2>



<div class="row mt-5">


<div class="col-md-4">


<div class="card bg-primary text-white">

<div class="card-body">

<h4>
Students
</h4>


<a href="/students"
class="btn btn-light">

Manage

</a>


</div>

</div>


</div>




<div class="col-md-4">


<div class="card bg-success text-white">

<div class="card-body">

<h4>
Add Student
</h4>


<a href="/students/add"
class="btn btn-light">

Add

</a>


</div>

</div>


</div>




<div class="col-md-4">


<div class="card bg-warning">

<div class="card-body">

<h4>
Profile
</h4>


<a href="/profile"
class="btn btn-dark">

View

</a>


</div>

</div>


</div>



</div>



</div>



</div>


</div>



</body>

</html>
