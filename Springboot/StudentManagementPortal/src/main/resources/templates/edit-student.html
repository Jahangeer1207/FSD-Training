<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Edit Student</h2>

<form action="/students/update"
      method="post"
      th:object="${student}">

<input type="hidden"
       th:field="*{id}">

<div class="mb-3">

<label>Name</label>

<input type="text"
       th:field="*{name}"
       class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
       th:field="*{email}"
       class="form-control">

</div>

<div class="mb-3">

<label>Course</label>

<input type="text"
       th:field="*{course}"
       class="form-control">

</div>

<div class="mb-3">

<label>Phone</label>

<input type="text"
       th:field="*{phone}"
       class="form-control">

</div>

<div class="mb-3">

<label>Address</label>

<textarea th:field="*{address}"
          class="form-control">
</textarea>

</div>

<button class="btn btn-primary">
Update Student
</button>

<a href="/students"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</body>
</html>
