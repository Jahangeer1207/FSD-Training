<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Add Student</h2>

<form action="/students/save"
      method="post">

<div class="mb-3">
<label>Name</label>
<input type="text"
       name="name"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email"
       name="email"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Course</label>
<input type="text"
       name="course"
       class="form-control">
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text"
       name="phone"
       class="form-control">
</div>

<div class="mb-3">
<label>Address</label>
<textarea name="address"
          class="form-control">
</textarea>
</div>

<button class="btn btn-success">
Save Student
</button>

<a href="/students"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</body>
</html>
