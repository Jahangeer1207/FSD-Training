<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
   

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html"> CVR College </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="register.html"> Add Student </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="#"> Dashboard </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html"> Contact </a>
            </li>
          </ul>
          <li class="nav-item">
            <button class="btn btn-danger ms-2" onclick="logout()">
              Logout
            </button>
          </li>

          <button class="btn btn-dark ms-3" onclick="toggleDarkMode()">
            🌙
          </button>
        </div>
      </div>
    </nav>

   

    <div class="container py-5">
      <h2 class="text-center mb-4">Student Dashboard</h2>

     

      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="card text-center shadow">
            <div class="card-body">
              <h3 id="totalStudents">0</h3>

              <h5>Total Students</h5>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center shadow border-success">
            <div class="card-body">
              <h3 id="presentStudents">0</h3>

              <h5>Present</h5>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center shadow border-danger">
            <div class="card-body">
              <h3 id="absentStudents">0</h3>

              <h5>Absent</h5>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center shadow border-warning">
            <div class="card-body">
              <h3 id="placements">0</h3>

              <h5>Placed</h5>
            </div>
          </div>
        </div>
      </div>

      

      <div class="row mb-4">
        <div class="col-md-6">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search by Name or Roll Number"
          />
        </div>
      </div>

   

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>Photo</th>
              <th>Roll No</th>
              <th>Name</th>
              <th>Branch</th>
              <th>Attendance</th>
              <th>Placement</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </div>

    

    <div class="modal fade" id="editModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Edit Student</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="editId" />

            <div class="mb-3">
              <label>Name</label>

              <input type="text" id="editName" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Email</label>

              <input type="email" id="editEmail" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Branch</label>

              <select id="editBranch" class="form-select">
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Civil</option>
                <option>Mechanical</option>
              </select>
            </div>

            <div class="mb-3">
              <label>Attendance</label>

              <select id="editAttendance" class="form-select">
                <option>Present</option>
                <option>Absent</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-success" onclick="saveStudent()">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/dashboard.js"></script>
    <script src="js/darkmode.js"></script>
  </body>
</html>
