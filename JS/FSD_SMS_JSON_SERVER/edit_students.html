<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Edit Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_students.html">Add Student</a>
        <a href="view_students.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <h1>Edit Student</h1>
    <form action="view_students.html" method="post" onsubmit="updateStudentDetails(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="Surya Basavaraju" required>
        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="20" required>
        <br><br>
        <label for="roll_no">Roll no:</label>
        <input type="text" id="roll_no" name="roll_no" value="23B81A05DN" required>
        <br><br>
        <label for="grade">Grade:</label>
        <input type="text" id="grade" name="grade" value="S" required>
        <br><br>
        <input type="submit" value="Update Student">
    </form>
</body>
<script>
    //Before updating anything... the form should be pre-filled with the existing details of the student.
    let studentId;
    window.onload = async function() {
        // Get the roll number from the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const rollNo = urlParams.get('roll_no');
        // Fetch the students from localStorage
        const response = await fetch('http://localhost:3000/students');
        const students = await response.json();
        const student = students.find(student => student.roll_no === rollNo);
        // If the student is found, pre-fill the form with their details
        if (student) {
            studentId=student.id;
            document.getElementById('name').value = student.name;
            document.getElementById('age').value = student.age;
            document.getElementById('roll_no').value = student.roll_no;
            document.getElementById('grade').value = student.grade;
        } else {
            alert('Student not found!');
            window.location.href = 'view_students.html';
        }
    };

    async function updateStudentDetails(event){
    event.preventDefault();
    const name=document.getElementById('name').value;
    const age=document.getElementById('age').value;
    const rollNo=document.getElementById('roll_no').value;
    const grade=document.getElementById('grade').value;

    await fetch(`http://localhost:3000/students/${studentId}`,{
        method:'PUT',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            id:studentId,
            name,
            age,
            roll_no:rollNo,
            grade
        })
    });

    alert('Student details updated successfully!');
    window.location.href='view_students.html';
}
</script>
</html>
