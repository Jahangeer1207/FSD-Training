<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html"> CVR College </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="#">Register</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>

          <button class="btn btn-dark ms-3" onclick="toggleDarkMode()">
            🌙
          </button>
        </div>
      </div>
    </nav>

    <!-- Registration Form -->

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h3 class="text-center">Student Registration Form</h3>
            </div>

            <div class="card-body">
              <form id="studentForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Full Name </label>

                    <input
                      type="text"
                      id="name"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Roll Number </label>

                    <input
                      type="text"
                      id="roll"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Email </label>

                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Mobile Number </label>

                    <input
                      type="text"
                      id="mobile"
                      class="form-control"
                      maxlength="10"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Gender </label>

                    <select id="gender" class="form-select" required>
                      <option value="">Select Gender</option>

                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Branch </label>

                    <select id="branch" class="form-select" required>
                      <option value="">Select Branch</option>

                      <option>CSE</option>
                      <option>ECE</option>
                      <option>EEE</option>
                      <option>Civil</option>
                      <option>Mechanical</option>
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Date of Birth </label>

                    <input type="date" id="dob" class="form-control" required />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Attendance </label>

                    <select id="attendance" class="form-select">
                      <option>Present</option>
                      <option>Absent</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label"> Address </label>

                  <textarea
                    id="address"
                    rows="3"
                    class="form-control"
                    required
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label"> Upload Photo </label>

                  <input
                    type="file"
                    id="photo"
                    accept="image/*"
                    class="form-control"
                    required
                  />
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Password </label>

                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label"> Confirm Password </label>

                    <input
                      type="password"
                      id="confirmPassword"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="terms" />

                  <label class="form-check-label">
                    Accept Terms and Conditions
                  </label>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-success">
                    Register Student
                  </button>
                </div>
              </form>

              <div id="message" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/register.js"></script>
    <script src="js/darkmode.js"></script>
  </body>
</html>
