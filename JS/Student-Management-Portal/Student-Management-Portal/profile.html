<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html"> CVR College </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="dashboard.html"> Dashboard </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="register.html"> Register </a>
            </li>
          </ul>
          <button class="btn btn-danger" onclick="studentLogout()">
            Logout
          </button>
          <button class="btn btn-dark ms-3" onclick="toggleDarkMode()">
            🌙
          </button>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row">
        <!-- Student Profile -->

        <div class="col-lg-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h3>Student Profile</h3>
            </div>

            <div class="card-body">
              <div class="row">
                <div class="col-md-4 text-center">
                  <img
                    id="profilePhoto"
                    class="img-fluid rounded-circle border shadow"
                    width="200"
                  />
                </div>

                <div class="col-md-8">
                  <h3 id="name"></h3>

                  <hr />

                  <p><strong>Roll Number:</strong> <span id="roll"></span></p>

                  <p><strong>Email:</strong> <span id="email"></span></p>

                  <p><strong>Mobile:</strong> <span id="mobile"></span></p>

                  <p><strong>Gender:</strong> <span id="gender"></span></p>

                  <p><strong>Branch:</strong> <span id="branch"></span></p>

                  <p><strong>DOB:</strong> <span id="dob"></span></p>

                  <p>
                    <strong>Attendance:</strong> <span id="attendance"></span>
                  </p>

                  <p>
                    <strong>Placement:</strong> <span id="placement"></span>
                  </p>

                  <p><strong>Address:</strong> <span id="address"></span></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ID Card -->

        <div class="col-lg-4">
          <div id="idCard" class="card shadow border-primary">
            <div class="card-header bg-primary text-white text-center">
              <h5>CVR College of Engineering</h5>
            </div>

            <div class="card-body text-center">
              <img
                id="idPhoto"
                width="120"
                height="120"
                class="rounded-circle border mb-3"
              />

              <h5 id="idName"></h5>

              <p id="idRoll"></p>

              <p id="idBranch"></p>

              <span class="badge bg-success"> Student </span>

              <hr />

              <p class="small">Cherabuddi Education Society</p>
            </div>
          </div>

          <div class="d-grid mt-3">
            <button class="btn btn-success" onclick="printIDCard()">
              Print ID Card
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/profile.js"></script>

    <script src="js/darkmode.js"></script>
  </body>
</html>
