<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold">🎓 CVR College Portal</a>

        <button class="btn btn-light"
                data-bs-toggle="modal"
                data-bs-target="#addStudentModal">
            + Add Student
        </button>
    </div>
</nav>

<!-- ================= CONTAINER ================= -->
<div class="container mt-4">

    <h3 class="mb-3 text-center">Student Dashboard</h3>

    <!-- SEARCH -->
    <input type="text"
           id="searchInput"
           class="form-control mb-3"
           placeholder="Search student...">

    <!-- TABLE -->
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            Student Records
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Email</th>
                        <th>Attendance</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>

        </div>
    </div>

    <!-- STATS -->
    <div class="mt-4 text-center">
        <h5>Total Students: <span id="totalStudents">0</span></h5>
    </div>

</div>

<!-- ================= ADD STUDENT MODAL ================= -->
<div class="modal fade" id="addStudentModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Add Student</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input id="addName" class="form-control mb-2" placeholder="Full Name">
                <input id="addRoll" class="form-control mb-2" placeholder="Roll Number">
                <input id="addBranch" class="form-control mb-2" placeholder="Branch">
                <input id="addEmail" class="form-control mb-2" placeholder="Email">
                <input id="addAttendance" class="form-control mb-2" placeholder="Attendance %">

            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveStudent()">
                    Save Student
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ================= BOOTSTRAP JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= JS FILE ================= -->
<script src="dashboard.js"></script>

</body>
</html>
